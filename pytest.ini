[pytest]
testpaths = tests
pythonpath = . tests

# The aiohttp adapter's tests are async, and they are the only ones that are.
# `auto` rather than a marker on each, so that a new test of Music Assistant's front
# door does not silently pass by never being awaited at all.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# `live` plays audio on real speakers in a real apartment. Excluded from the
# default run by `addopts` rather than by living outside `testpaths`, so that
# collection still imports the suite and a syntax error or a bad import in it
# is caught by an ordinary `pytest` - the alternative is a live suite that has
# been broken for a month and nobody found out until the night they ran it.
#
#   pytest                          the 699 offline tests, no speakers touched
#   pytest -m live tests/live       the conformance run (a command line -m
#                                   overrides the one here)
markers =
    live: drives real Echo devices through a real Music Assistant

addopts = -m "not live"
