{% set busy = upload_job and upload_job.running %}
<nav class="stepnav" id="stepnav"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <ul>
    <li>{% if previous %}
      <a href="/setup/wizard/{{ previous }}" class="btn" data-variant="outline">Back</a>
    {% endif %}</li>
    <li>
      {% if busy %}
        <button class="btn" disabled
                title="An upload is running. Leaving this page would stop it; Continue unlocks when it finishes.">Continue</button>
      {% elif step.done and next %}
        <a href="/setup/wizard/{{ next }}" class="btn">Continue</a>
      {% elif step.done %}
        <a href="/setup/wizard" class="btn">Finish</a>
      {% else %}
        <button class="btn" disabled
                title="Complete this step to unlock Continue.">Continue</button>
      {% endif %}
    </li>
  </ul>
</nav>
